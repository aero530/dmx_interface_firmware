[package]
name = "pico2"
version = "0.1.0"
edition = "2021"
description = "DMX interface firmware for the W6300-EVB-Pico2 (RP2350 + W6300)"

[[bin]]
name = "pico2"
test = false
bench = false

# Standalone bench panel probe — see src/bin/panel_probe.rs. Built on demand
# with `cargo uf2 --bin panel_probe`; not part of the shipped firmware.
[[bin]]
name = "panel_probe"
test = false
bench = false

# Variant B of the probe: same reset path, CS static low. Isolates which of the
# two differences from Rev 2 actually matters.
[[bin]]
name = "panel_probe_staticcs"
test = false
bench = false

[features]
# Mirrors nucleo: `usb` swaps defmt logging for `log` over a USB CDC interface.
# `common/usb` must track it so the shared sources pick the same macros.
default = []
usb = ["common/usb"]

[dependencies]
# Target-agnostic core: settings model, event router, channels, Art-Net,
# Enttec framing, shared buffers. Same crate the nucleo build uses.
common = { path = "../common" }

embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp235xa",
    "binary-info",
] }
# The RP2350 IMAGE_DEF is emitted automatically by embassy-rp for _rp235x
# (defaults to secure_exe); do not enable `imagedef-none`.
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = "0.1.2"

# Networking. MACRAW puts smoltcp under embassy-net, so the Art-Net task in
# `common` sees the same API it did on the STM32's built-in MAC.
embassy-net = { version = "0.9.1", features = [
    "defmt", "dns", "udp", "tcp", "dhcpv4", "medium-ethernet", "proto-ipv6",
    # sACN is multicast, one group per universe.
    "multicast",
    # Reply to ping. smoltcp 0.13 moved the automatic ICMP echo reply behind
    # this feature, and it is in smoltcp's *default* set — which embassy-net
    # turns off (`default-features = false`), so nothing enables it unless we
    # ask. Without it the node answers ARP, takes a DHCP lease and passes
    # Art-Net traffic, but silently ignores every echo request, so the first
    # thing anyone does to check a node on site fails while the node is
    # entirely healthy. Stage 5 of `docs/BRINGUP.md` pings it on purpose.
    "auto-icmp-echo-reply",
] }
embassy-net-wiznet = { version = "0.3.0", features = ["defmt"] }
# sACN joins one multicast group per universe, a 32-universe window
# (`sacn_rx::JOIN_COUNT`). smoltcp's group table is a compile-time size that
# defaults to **4**, so without this 28 of the 32 joins fail and, behind an
# IGMP-snooping switch, only four universes ever arrive. embassy-net does not
# expose the knob; features unify, so it is set on smoltcp directly.
smoltcp = { version = "0.13", default-features = false, features = ["iface-max-multicast-group-count-32"] }
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-hal = "1.0"
embedded-hal-async = "1.0"
# Read/Write traits for embassy-rp's BufferedUart (the FT232RL widget port);
# 0.7 is the version embassy-rp 0.10 implements.
embedded-io-async = "0.7"
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-usb-logger = "0.6.0"
heapless = { version = "0.9", default-features = false }
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
rand_core = "0.9.3"

# The ported sources switch between defmt and log macros on the `usb`
# feature, same as the STM32 build.
# Settings are bincode-encoded into the EEPROM; held at 2.x to match `common`.
bincode = { version = "2.0.1", default-features = false, features = ["derive"] }
cfg-if = "1.0.3"
log = "0.4.29"

defmt = "1.1.1"
defmt-rtt = { version = "1.3.0", features = ["disable-blocking-mode"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.6"
critical-section = "1.1"
static_cell = "2.1"

# `common::ui::fields` formats menu strings, so the binary must supply an
# allocator. Far smaller here than on nucleo: a 128x64 mono framebuffer is
# 1 KB against the TFT's ~108 KB.
embedded-alloc = "0.7.0"

smart-leds = "0.4.0"

# Display: ST7789 172x320 TFT over SPI1 through mipidsi (which carries its own
# SPI interface - no display-interface crate needed), drawn through Ratatui via
# mousefood's embedded-graphics backend in Rgb565.
mipidsi = "0.9.0"
embedded-graphics = "0.8.2"
mousefood = { version = "0.5.2", default-features = false, features = ["fonts"] }
ratatui-core = { version = "0.1.2", default-features = false }
ratatui-widgets = { version = "0.3.2", default-features = false }
fixed = "1.29.0"

# NOTE: build profiles live in the workspace root Cargo.toml — cargo ignores
# [profile.*] in workspace members.
