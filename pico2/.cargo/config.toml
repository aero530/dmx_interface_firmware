[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# probe-rs over SWD (the carrier breaks out the 3-pin debug header).
runner = "probe-rs run --chip RP235x"
# Alternative when only USB is available: hold BOOTSEL, then
# runner = "picotool load -u -v -x -t elf"

# flip-link puts the stack below RAM so an overflow hard-faults instead of
# silently corrupting statics. Same arrangement the Rev 1 bridge firmware used.
linker = "flip-link"
rustflags = [
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]

[build]
target = "thumbv8m.main-none-eabihf"

[env]
# `info` is the shipping level: `debug` fires per ArtPoll and per VSYS sample.
# Override for a bench session with `DEFMT_LOG=debug cargo run --release`.
DEFMT_LOG = "info"
