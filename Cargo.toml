[workspace]
resolver = "3"
members = [ "common", "pico2", "rp2040_dmx", "xtask", "vendor/embassy-net-wiznet"]
# dmx_console (PC tool) and host_tests (host-runnable firmware unit tests)
# have their own dependency trees; keeping them out of the embedded
# workspace keeps Cargo.lock clean. rp2040 is an empty placeholder crate,
# excluded until it has real code.
#
# `xtask` is a dependency-free host helper (`cargo uf2` builds the firmware
# and converts the ELF to a UF2 for BOOTSEL flashing). It has no dependencies,
# so it does not touch the critical-section unification below. Run it from
# this directory: inside pico2/ the .cargo/config.toml there forces the ARM
# target and the host tool would not build.
#
# NOTE: `cargo build --workspace` is not supported — build from inside each
# crate's folder (which also applies its .cargo/config.toml target/runner).
# Workspace-wide builds feature-unify `critical-section`, and nucleo
# (single-core, restore-state-bool) and rp2040_dmx (multicore,
# restore-state-u8) require conflicting implementations.
# `nucleo` is FROZEN, not deleted. It stopped building when `common` moved to
# embassy-sync 0.8: embassy-stm32 0.4 -> 0.6 and embassy-net 0.7 -> 0.9 need a
# ~72-error migration, including a reworked Ethernet PHY API — on the exact code
# the W6300 replaces. Its job (proving the Phase 1 extraction of `common` stayed
# faithful) is done and passed; `common` is now validated by host_tests and by
# pico2 compiling against it. Delete once pico2 ships, or migrate if a deployed
# STM32 unit ever needs patching.
exclude = ["dmx_console", "host_tests", "nucleo", "rp2040"]

# `embassy-net-wiznet` is vendored at 0.3.0 with one patch: the W6300 socket-0
# RX buffer raised from 4 KB to the chip's full 16 KB, which needed sockets 1-7
# zeroed and had no configuration path upstream. See
# vendor/embassy-net-wiznet/PATCHES.md for the diff, the measurement behind it,
# and the upstream status. Remove this patch and the member above when upstream
# ships an equivalent.
[patch.crates-io]
embassy-net-wiznet = { path = "vendor/embassy-net-wiznet" }

# Build profiles must be defined here: cargo silently ignores [profile.*]
# sections in workspace member manifests (nucleo, rp2040_dmx, ...).

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false
